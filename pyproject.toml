[project]
name = "formalllm"
version = "0.1.0"
description = "Type-directed program synthesis research: GHC Core transformer and Lean 4 MCTS"
readme = "README.md"
license = "MIT"
authors = [{ name = "Manuel Rodriguez" }]
requires-python = ">=3.14"
dependencies = [
    "torch>=2.10.0",
    "torchvision",
    "tokenizers>=0.21",
    "numpy>=2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
